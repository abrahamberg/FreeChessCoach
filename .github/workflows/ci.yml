name: CI

on:
  push:
    # Other branches are covered by their pull_request run; pushing them too
    # would run every PR (including Dependabot's) twice.
    branches: [main]
  pull_request:
  # The daily run is off since 2026-10-01 to save Actions minutes. It was the
  # full-suite safety net: --changed only sees files a test statically
  # imports, so a regenerated fixture (e.g. data/*.csv, data/*.tsv) or any
  # other change with no import edge to its test could slip past the
  # affected-only run below. Until it is back, start a manual run with `full`
  # ticked now and then. To turn it back on:
  #   schedule:
  #     - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full test suite regardless of what changed'
        type: boolean
        default: false

# Read-only token: CI only checks out, tests and builds the app.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (docs/threat-model.md R7); Dependabot keeps
# the SHAs and the version comments current.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (all branches) so `vitest --changed` can diff
          # against the base branch below.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build -w @freechesscoach/web

      # Ephemeral (development-driving) tests are deleted before a task's last
      # commit; one that reaches the repo would run in every default suite.
      - name: No ephemeral tests committed
        run: |
          found=$(git ls-files '*.wip.test.ts' '*.wip.test.tsx')
          if [ -n "$found" ]; then
            echo "ephemeral test committed:"
            echo "$found"
            exit 1
          fi

      # main only ever advances via a merged, already-CI-passed PR, so the
      # full run here (plus a manual full run; the nightly cron above is off) is a backstop. PRs run
      # affected-only below, except dependency and toolchain changes: a
      # lockfile bump has no import edge to any test, so `--changed` would run
      # nothing for it, and Dependabot PRs are auto-merged on this result.
      - name: Decide test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FORCE_FULL: ${{ github.event.inputs.full }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$FORCE_FULL" = "true" ] || [ "$REF_NAME" = "main" ]; then
            full=true
          elif git diff --name-only "origin/${BASE_REF:-main}...HEAD" \
              | grep -qE '(^|/)package(-lock)?\.json$|^\.nvmrc$|^vitest\.config\.ts$|^tsconfig'; then
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # apps/api's suite spins up a real Postgres via Testcontainers; the
      # ubuntu-latest runner ships a working Docker daemon for that.
      - name: Run full test suite
        if: steps.scope.outputs.full == 'true'
        run: npm test

      # The opt-in tiers: the tactic corpus (no engine) and the golden course
      # facts (fixture engine), both pure replays. On a manual
      # full run only; a PR reaches them by running them itself.
      - name: Run corpus and golden tiers
        if: github.event_name == 'schedule' || github.event.inputs.full == 'true'
        run: |
          npm run test:corpus
          npm run test:golden

      # vitest walks the real import graph from every changed file (working
      # tree + everything committed since the base branch) to the test files
      # that could exercise it, so this isn't a hand-maintained path map —
      # it's exact for anything reached through an import. A change with no
      # affected tests exits 0 with nothing run (see the schedule note above
      # for what this mode can't see).
      - name: Run tests affected by this change
        if: steps.scope.outputs.full == 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx vitest run --changed "origin/${BASE_REF:-main}"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - run: helm lint deploy/helm/freechesscoach -f deploy/helm/freechesscoach/values.example.yaml

      - run: deploy/helm/test.sh

  # The one check branch protection requires, so adding or renaming a job
  # above never needs a settings change.
  ci-passed:
    if: always()
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
