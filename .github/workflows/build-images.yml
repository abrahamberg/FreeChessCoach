name: Build and publish images

on:
  # Publish only what CI has passed: a green CI run for a push to main. (A PR
  # merged by the auto-merge bot pushes with GITHUB_TOKEN, which starts no
  # workflows, so Dependabot merges ride along with the next human push.)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Publish exactly this one image tag and touch nothing else (no version
          bump, no git tag). Leave empty for the normal flow: latest plus a
          version auto-bumped from HEAD's commit message (patch by default,
          minor for `feat:`, major for `feat!:`/`BREAKING CHANGE:`).
        required: false
        type: string

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: write
  packages: write

# Two runs at once would resolve the same `next` version and race on the tag
# push; the loser fails after having already pushed images.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI actually tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Git tags are the version of record and checkout fetches none by
          # default. fetch-tags alone doesn't do it: with the default shallow
          # fetch-depth, actions/checkout silently fetches no tags at all, so
          # every run looks like the first one. fetch-depth: 0 (full history)
          # is what actually makes fetch-tags work.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        if: inputs.tag == ''
        run: scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Note that this commit is already published
        if: steps.version.outputs.skip == 'true'
        env:
          PUBLISHED: ${{ steps.version.outputs.published }}
        run: |
          echo "::notice::HEAD is already published as $PUBLISHED; skipping the build."
          {
            echo "### Nothing to publish"
            echo
            echo "HEAD is already published as \`$PUBLISHED\` — no images were rebuilt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base images come from Docker Hardened Images (see docker/Dockerfile.*).
      - name: Log in to Docker Hardened Images
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.version.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Last gate before anything reaches the registry: build for the runner's
      # own architecture and run the images the way the chart does. The
      # multi-arch push below reuses these artifacts (--skip-artifacts).
      - name: Build and smoke-test the images locally
        if: steps.version.outputs.skip != 'true'
        run: |
          scripts/build-images.sh --platform "" --tag smoke
          scripts/smoke-images.sh --tag smoke

      - name: Build and publish api, web, and engine images
        if: steps.version.outputs.skip != 'true'
        env:
          # Via env, not ${{ }} interpolation: the input is user-supplied text.
          INPUT_TAG: ${{ inputs.tag }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tags=(--tag "$INPUT_TAG")
            published="$INPUT_TAG"
          else
            tags=(--tag latest --tag "$NEXT_VERSION")
            published="latest, $NEXT_VERSION"
          fi
          # --summary-file writes every reference it created to the run page;
          # the notice puts the same tags in the run's annotations, so "what
          # does latest point at now?" is answerable without opening the log.
          scripts/build-images.sh \
            --registry "$REGISTRY" \
            "${tags[@]}" \
            --platform linux/amd64,linux/arm64 \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --skip-artifacts \
            --push
          echo "::notice::Published $REGISTRY/freechesscoach api, web and engine images tagged: $published"

      # After the push: a build that fails must not burn a version number, and
      # the tag is what tells the next run this commit is done.
      - name: Tag the published commit
        if: inputs.tag == '' && steps.version.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
