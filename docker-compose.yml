x-node-dev: &node-dev
  image: node:22-slim
  working_dir: /app
  volumes:
    - .:/app
    # Optional — external dir holding lichess-eval-index.bin / puzzle-pool.bin
    # (set LICHESS_EVAL_INDEX_PATH / PUZZLE_POOL_PATH to matching in-container
    # paths in .env). Left unset, it's skipped and the repo bind mount above is
    # used instead. Only api/worker consume these files.
    - ${LICHESS_EVAL_DATA_HOST_DIR:-/mnt/ssd/applications/pvc-27602c9c-129f-4ca2-922a-6d28e61f16a1_freechesscoach_freechesscoach-lichess-eval-index}:/mnt/ssd/applications/pvc-27602c9c-129f-4ca2-922a-6d28e61f16a1_freechesscoach_freechesscoach-lichess-eval-index
  environment: &node-dev-env
    DATABASE_URL: postgresql://chess_coach:chess_coach@postgres:5432/chess_coach
    ENGINE_URL: http://engine:8081
    LLM_UNLOCK_PEPPER: ${LLM_UNLOCK_PEPPER:-local-development-pepper}
    LLM_UNLOCK_CACHE_KEY: ${LLM_UNLOCK_CACHE_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    LLM_UNLOCK_TTL_SECONDS: ${LLM_UNLOCK_TTL_SECONDS:-900}
    REDIS_URL: redis://redis:6379
    LLM_FAKE: ${LLM_FAKE:-0}
    LLM_REASONING_STANDARD: ${LLM_REASONING_STANDARD:-medium}
    LLM_REASONING_LIGHT: ${LLM_REASONING_LIGHT:-none}
    LLM_OPENAI_SERVICE_TIER: ${LLM_OPENAI_SERVICE_TIER:-auto}
    AUTH_MODE: ${AUTH_MODE:-dev-stub}
    POSITION_EVAL_CACHE_MAX_ROWS: ${POSITION_EVAL_CACHE_MAX_ROWS:-200000}
    POSITION_EVAL_CACHE_MIN_AGE_DAYS: ${POSITION_EVAL_CACHE_MIN_AGE_DAYS:-3}
    # Prod overrides these with files on the mounted PVC. Locally the repo
    # bind mount provides the same paths; startup logs clearly say when either
    # file has not been built or cannot be read.
    LICHESS_EVAL_INDEX_PATH: ${LICHESS_EVAL_INDEX_PATH:-/app/apps/api/data/lichess-eval-index.bin}
    PUZZLE_POOL_PATH: ${PUZZLE_POOL_PATH:-/app/apps/api/data/puzzle-pool.bin}
    ENGINE_TUNNEL_INTERNAL_TOKEN: ${ENGINE_TUNNEL_INTERNAL_TOKEN:-dev-internal-token}
    API_INTERNAL_URL: http://api:3000
    # Structured dev logging (see apps/api/src/lib/dev-log.ts) — comma-separated
    # event-type allowlist, e.g. DEBUG_LOG=bot_move, or DEBUG_LOG=* for
    # everything. Unset by default so normal logs stay quiet. Set it in your
    # shell before `npm run dev`/`docker compose up` (compose only forwards env
    # vars a service's `environment:` block references, so this has to be wired
    # in here — the container never sees your host shell's env otherwise).
    DEBUG_LOG: ${DEBUG_LOG:-}

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chess_coach
      POSTGRES_USER: chess_coach
      POSTGRES_PASSWORD: chess_coach
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chess_coach']
      interval: 2s
      timeout: 5s
      retries: 20

  engine:
    <<: *node-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.engine.dev
    environment:
      <<: *node-dev-env
      STOCKFISH_PATH: /usr/games/stockfish
      PORT: '8081'
    command: npm run dev --workspace=@freechesscoach/engine
    ports:
      - '8081:8081'

  migrate:
    <<: *node-dev
    command: npm run migrate --workspace=@freechesscoach/api
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *node-dev
    command: npm run dev --workspace=@freechesscoach/api
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *node-dev
    command: npm run dev:worker --workspace=@freechesscoach/api
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web-dev:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    command: npm run dev --workspace=@freechesscoach/web -- --host
    ports:
      - '5173:5173'
    depends_on:
      - api

  # Optional — only needed to exercise the real proxy-auth path (design.md/architecture.md §11).
  # Daily dev uses AUTH_MODE=dev-stub instead (see docs/dev-setup.md); this profile
  # requires real Google + Lichess OAuth app credentials, which are never checked in.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    profiles: ['auth']
    command:
      - --http-address=0.0.0.0:4180
      - --upstreams=http://api:3000
      - --email-domain=*
      - --set-xauthrequest=true
      - --skip-auth-route=^/healthz$
      - --skip-auth-route=^/readyz$
    # OAUTH2_PROXY_CLIENT_ID/_SECRET/_COOKIE_SECRET must be set in a .env file
    # (see docs/dev-setup.md) before `docker compose --profile auth up` will
    # actually authenticate anyone — these placeholders just let the file
    # parse without a .env present for everyday (non-auth-profile) dev.
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-unset-see-docs-dev-setup}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-unset-see-docs-dev-setup}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-unset-see-docs-dev-setup}
    ports:
      - '4180:4180'
    depends_on:
      - api

volumes:
  postgres-data:
