# Worked example of a real deployment. Copy, adjust, and install with:
#
#   kubectl create secret generic postgres-credentials \
#     --from-literal=postgres-password="$(openssl rand -base64 24)" \
#     --from-literal=password="$(openssl rand -base64 24)" \
#     --from-literal=replication-password="$(openssl rand -base64 24)"
#   kubectl create secret generic llm-unlock-secrets \
#     --from-literal=pepper="$(openssl rand -base64 32)" \
#     --from-literal=cache-key="$(openssl rand -base64 32)"
#   kubectl create secret generic oauth-clients \
#     --from-literal=client-id=... --from-literal=client-secret=... \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | head -c 32)"
#
#   helm dependency build deploy/helm/freechesscoach
#   helm upgrade --install freechesscoach deploy/helm/freechesscoach \
#     -f deploy/helm/freechesscoach/values.example.yaml
#
# No credential values appear in this file — only the names of the Secrets and
# of the keys inside them (architecture §11).

image:
  registry: ghcr.io/example-org
  pullPolicy: IfNotPresent

web:
  image:
    repository: freechesscoach
    tag: "web-v0.0.1"

api:
  image:
    repository: freechesscoach
    tag: "api-v0.0.1"
  authMode: proxy
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 1

engine:
  image:
    repository: freechesscoach
    tag: "engine-v0.0.1"
  poolSize: 4
  defaultDepth: 20
  moveTimeoutMs: 4000
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

llm:
  reasoning:
    standard: medium
    light: none
  # Set to `flex` to trade coach latency for roughly half the OpenAI spend.
  openaiServiceTier: auto
  fake: false
  unlock:
    existingSecret: llm-unlock-secrets
    pepperKey: pepper
    cacheKey: cache-key
    redisUrl: redis://your-redis-host:6379
    ttlSeconds: 900

database:
  sslMode: disable

# The cluster ExternalSecret syncs the Bitwarden item
# `freechesscoach-database-url` into this Secret under DATABASE_URL.
externalDatabase:
  existingSecret: freechesscoach-database-url
  existingSecretDatabaseUrlKey: DATABASE_URL

migrate:
  enabled: true
  hooks:
    - pre-install
    - pre-upgrade

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: freechesscoach.org
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    - secretName: freechesscoach-tls
      hosts:
        - freechesscoach.org

postgresql:
  # Use the complete DATABASE_URL supplied by External Secrets.
  enabled: false
  auth:
    username: chess_coach
    database: chess_coach
    existingSecret: postgres-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password
  primary:
    persistence:
      enabled: true
      size: 50Gi

global:
  # Public origin, no trailing slash: feeds oauth2-proxy redirect_url + cookie_secure.
  publicUrl: https://freechesscoach.org

oauth2-proxy:
  # This is a separate instance for freechesscoach. The server-level
  # oauth2-proxy may use Azure; this instance is configured for Google.
  enabled: true
  replicaCount: 2
  config:
    existingSecret: oauth-clients
    clientID: ""
    clientSecret: ""
    cookieSecret: ""
    # No configFile / extraArgs here on purpose: the chart's defaults carry the
    # upstreams, the provider and every public skip-auth route, and global.publicUrl
    # (above) supplies the callback URL. Overriding either one copies a list Helm
    # would replace rather than merge, and the copy goes stale.
    #
    # To offer Lichess instead of Google (architecture §11 names it as a generic
    # OAuth2 provider) you must override extraArgs and copy the chart's
    # skip-auth routes with it, swapping --provider=google for:
    #   --provider=oidc --provider-display-name=Lichess
    #   --login-url=https://lichess.org/oauth
    #   --redeem-url=https://lichess.org/api/token
    #   --profile-url=https://lichess.org/api/account
    #   --scope=email:read
  service:
    portNumber: 80
  ingress:
    enabled: false
