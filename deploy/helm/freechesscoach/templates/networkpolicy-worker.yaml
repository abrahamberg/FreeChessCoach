{{- if .Values.networkPolicy.enabled }}
{{/* The worker exposes no ports at all: an empty `ingress` list with
     policyTypes [Ingress] denies every inbound connection. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "worker") }}
  labels:
    {{- include "freechesscoach.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
