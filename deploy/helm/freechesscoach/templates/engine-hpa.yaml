{{- if .Values.engine.autoscaling.enabled }}
{{/* architecture §11: "engine: 1–3 replicas; HPA on CPU". */}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "engine") }}
  labels:
    {{- include "freechesscoach.labels" (dict "ctx" . "component" "engine") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "engine") }}
  minReplicas: {{ .Values.engine.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.engine.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.engine.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
