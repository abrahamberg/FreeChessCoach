apiVersion: v1
kind: Service
metadata:
  name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "web") }}
  labels:
    {{- include "freechesscoach.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
