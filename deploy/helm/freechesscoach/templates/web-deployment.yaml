{{/* nginx serving the pre-built Vite bundle (docker/Dockerfile.web). Static
     only — `/api` routing is oauth2-proxy's job, not nginx's. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "web") }}
  labels:
    {{- include "freechesscoach.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "web") | nindent 8 }}
    spec:
      {{- include "freechesscoach.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "freechesscoach.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "freechesscoach.image" (dict "ctx" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "freechesscoach.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
