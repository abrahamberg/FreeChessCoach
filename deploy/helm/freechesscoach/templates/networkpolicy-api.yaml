{{- if .Values.networkPolicy.enabled }}
{{/* architecture §11: only oauth2-proxy is ingress-exposed, so the api accepts
     HTTP only from the proxy's pods. Egress is intentionally unrestricted — the
     api calls LLM providers (per-user BYOK keys).

     The worker also talks to the api directly, bypassing oauth2-proxy: its
     engine-tunnel relay (RelayEngineTunnelTransport -> routes/engine-tunnel-
     internal.ts) is how a worker job reaches the browser-mode tunnel
     connection the api process holds, since the worker never holds that
     WebSocket itself. That route is guarded by its own shared-secret header
     rather than oauth2-proxy identity headers, so allowing the worker pod
     here doesn't weaken auth on the oauth2-proxy-fronted routes. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "api") }}
  labels:
    {{- include "freechesscoach.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "worker") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
{{- end }}
