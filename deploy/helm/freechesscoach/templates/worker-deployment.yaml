{{/* Same image as the api, different entrypoint (worker.mjs is the bundled
     graphile-worker runner). architecture §11: 1 replica, no HPA. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freechesscoach.componentName" (dict "ctx" . "component" "worker") }}
  labels:
    {{- include "freechesscoach.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    {{- toYaml (.Values.worker.strategy | default (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 0 "maxUnavailable" 1))) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freechesscoach.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
    spec:
      {{- include "freechesscoach.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "freechesscoach.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "freechesscoach.image" (dict "ctx" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist-bundle/worker.mjs"]
          securityContext:
            {{- include "freechesscoach.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "freechesscoach.env.database" . | nindent 12 }}
            {{- include "freechesscoach.env.app" . | nindent 12 }}
          {{- with include "freechesscoach.lichessEvalIndexVolumeMount" . }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with include "freechesscoach.lichessEvalIndexVolume" . }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
