# Default values for the freechesscoach umbrella chart.
#
# Nothing sensitive lives here. Every credential is read at runtime from a
# Secret you create out-of-band (architecture.md §11 "templated existingSecret
# pattern"); this file only ever names the Secret and the key inside it. The
# four Secrets the chart expects are:
#
#   llm-unlock-secrets     pepper, cache-key, redis-url (unlock/cache secrets)
#   oauth-clients          client-id, client-secret, cookie-secret
#   postgres-credentials   postgres-password, password, replication-password
#
# See values.example.yaml for a filled-in deployment.
#
# Resource names are derived from the release name alone (there is no
# nameOverride/fullnameOverride): the oauth2-proxy upstream URLs below are
# release-name-derived strings and cannot call a chart helper.

## Image defaults shared by web/api/worker/engine.
image:
  # Registry prefix applied to every repository below, e.g. "ghcr.io/acme".
  # Empty means the repository is already fully qualified.
  registry: ""
  pullPolicy: IfNotPresent
  # List of {name: <secret>} entries.
  pullSecrets: []

## nginx serving the Vite build (docker/Dockerfile.web).
web:
  image:
    repository: freechesscoach
    # Defaults to .Chart.AppVersion.
    tag: ""
  # architecture §11: 2 replicas.
  replicaCount: 2
  # nginx-unprivileged listens on 8080.
  containerPort: 8080
  service:
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  nodeSelector: {}
  tolerations: []

## Fastify HTTP API (docker/Dockerfile.api, apps/api/src/server.ts).
api:
  image:
    repository: freechesscoach
    tag: ""
  # Used only when autoscaling is disabled; architecture §11: 2 replicas.
  replicaCount: 2
  containerPort: 3000
  service:
    port: 3000
  # AUTH_MODE. "proxy" (the default posture) makes the API refuse requests that
  # lack oauth2-proxy's identity headers. "dev-stub" is local-only — never set
  # it in a cluster (§12).
  authMode: proxy
  # architecture §11: HPA on CPU.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 768Mi
  nodeSelector: {}
  tolerations: []

## graphile-worker job runner (same image as the api, apps/api/src/worker.ts).
worker:
  # architecture §11: 1 replica (scale by queue depth later).
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []

## Stockfish HTTP wrapper (docker/Dockerfile.engine, services/engine).
engine:
  image:
    repository: freechesscoach
    tag: ""
  # Used only when autoscaling is disabled.
  replicaCount: 1
  containerPort: 8081
  service:
    port: 8081
  # ENGINE_POOL_SIZE — concurrent Stockfish processes per pod.
  poolSize: 2
  # ENGINE_DEFAULT_DEPTH / ENGINE_MOVE_TIMEOUT_MS.
  defaultDepth: 18
  moveTimeoutMs: 3000
  # STOCKFISH_PATH inside the engine image.
  stockfishPath: /usr/games/stockfish
  # architecture §11: 1–3 replicas, HPA on CPU.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # Left empty on purpose: the engine Deployment then requests `poolSize` CPU
  # cores, per architecture §11. Set this to override the whole block.
  resources: {}
  nodeSelector: {}
  tolerations: []

## LLM gateway configuration. Users supply endpoint, models and key in the web
## app; the chart only wires the short-lived unlock cache.
llm:
  # Reasoning effort per tier. One portable setting that both Anthropic and
  # OpenAI translate natively: provider-default|none|minimal|low|medium|high|xhigh.
  # The coach reasons about positions and its own Socratic strategy; light-tier
  # subagents only reformat text that has already been decided.
  reasoning:
    standard: medium
    light: none
  # OpenAI's service tier: auto|default|flex|priority. `flex` is roughly half
  # price but slower and can be refused under load — leave on `auto` unless
  # latency is not a concern. Anthropic has no equivalent and ignores this.
  openaiServiceTier: auto
  # LLM_FAKE=1: short-circuit every model call. Smoke tests only.
  fake: false
  unlock:
    existingSecret: llm-unlock-secrets
    pepperKey: pepper
    cacheKey: cache-key
    redisUrlKey: redis-url
    ttlSeconds: 900

## Read-only Lichess evaluation index (~394M pre-analyzed positions), checked
## before the live engine chain — see docs/architecture.md and
## apps/api/data/README.md for the design. Built locally, refreshed by hand
## (`npm run build-lichess-eval-index -w @freechesscoach/api`, never wired
## into build:images, the migrate-job, or any CI pipeline — the built file is
## multi-GB, never committed to git and never uploaded as part of a deploy).
##
## Deliberately a PersistentVolumeClaim, not an init-container fetch: the
## file is copied onto it once (see apps/api/data/README.md's `kubectl cp`
## flow) and then just sits there across ordinary app deploys and pod
## restarts — a rollout of a new api/worker image never re-touches it, only
## an explicit dataset refresh does. Disabled by default: no PVC, no volume,
## no env vars, until you've built and copied a file in — resolveEngineBackend
## then simply skips this tier.
lichessEvalIndex:
  enabled: false
  # Set to reuse a PVC you provisioned yourself; leave empty and the chart
  # creates one from storageClassName/accessMode/size below.
  existingClaim: ""
  storageClassName: shared-nas
  accessMode: ReadWriteOnce
  # v3 index format (Phase 49): per-line-rank multi-ply continuations sized
  # to the graduated scan schedule (scanDepthForRank) — 123-byte records vs
  # v2's 63, roughly 1.95x v2's size. v2 was ~25GB at the ~401M-position
  # full-dataset target, so v3 is ~49GB — sized here with headroom for
  # dataset growth between rebuilds. See apps/api/data/README.md.
  size: 64Gi
  # Mounted into api and worker at this path; becomes LICHESS_EVAL_INDEX_PATH.
  mountPath: /var/run/lichess-eval-index/lichess-eval-index.bin
  # LICHESS_EVAL_MIN_DEPTH — a hit shallower than this is treated as a miss
  # and falls through to the live engine chain, same as a position the
  # index has never seen.
  minDepth: 16

## Extra env vars appended to the api and worker containers, as a raw k8s env
## list. Escape hatch for settings the chart doesn't model yet.
extraEnv: []

## Connection settings the app needs regardless of where Postgres lives.
database:
  # sslmode in DATABASE_URL. "disable" is fine for the in-cluster subchart;
  # use "require" (or stricter) for a managed database.
  sslMode: disable

## Used only when postgresql.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  user: chess_coach
  database: chess_coach
  # The cluster ExternalSecret should sync the Bitwarden item
  # `freechesscoach-database-url` into this Secret under DATABASE_URL.
  existingSecret: freechesscoach-database-url
  existingSecretDatabaseUrlKey: DATABASE_URL
  existingSecretPasswordKey: password

## kysely migrations, run as a Helm hook (architecture §11).
migrate:
  enabled: true
  # Argo CD must run this after ExternalSecrets have synced.
  argocdHook: false
  # See the note in templates/migrate-job.yaml about first installs with the
  # bundled postgresql subchart.
  hooks:
    - pre-install
    - pre-upgrade
  backoffLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

## architecture §11: api/worker/engine accept in-cluster traffic only; only
## oauth2-proxy is ingress-exposed; engine accepts only api+worker.
networkPolicy:
  enabled: true

## The single ingress-exposed route, pointing at oauth2-proxy.
ingress:
  enabled: true
  className: ""
  # Required when enabled — the public hostname of the deployment.
  host: ""
  # Override these when oauth2-proxy is installed separately in the serving
  # namespace. The default targets this chart's oauth2-proxy subchart.
  backend:
    serviceName: ""
    servicePort: 0
  annotations: {}
  # e.g. [{secretName: freechesscoach-tls, hosts: [coach.example.com]}]
  tls: []

## Applied to every pod/container this chart owns (§12).
## runAsUser is NOT optional next to runAsNonRoot: with runAsNonRoot alone,
## kubelet must derive the uid from the image and refuses to start any container
## whose image runs as root or names its user non-numerically
## ("image has non-numeric user (node), cannot verify user is non-root").
## 1000 is the uid every image in docker/ declares (`USER 1000`); change both
## together or pods will fail admission, not just misbehave.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# ---------------------------------------------------------------------------
# Subchart: PostgreSQL 16 (bitnami/postgresql 15.5.38 -> appVersion 16.4.0).
# Set enabled: false and fill in externalDatabase to use a managed database.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    username: chess_coach
    database: chess_coach
    # Passwords come from this pre-created Secret; the keys below are the ones
    # the bitnami chart expects.
    existingSecret: postgres-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
      replicationPasswordKey: replication-password
  primary:
    persistence:
      enabled: true
      size: 20Gi

# ---------------------------------------------------------------------------
# Subchart: oauth2-proxy (architecture §11). This is the only component the
# Ingress points at; it fans out to the api and the web bundle.
# ---------------------------------------------------------------------------
oauth2-proxy:
  enabled: true
  replicaCount: 2
  config:
    # client-id / client-secret / cookie-secret come from this Secret. The
    # literal fields below stay empty so the subchart never renders a Secret.
    existingSecret: oauth-clients
    clientID: ""
    clientSecret: ""
    cookieSecret: ""
    # Rendered through `tpl` by the subchart, so .Release.Name resolves — but
    # subchart values cannot call this chart's helpers, so the service names and
    # ports below are written out. Keep them in step with api.service.port and
    # web.service.port if you change either.
    configFile: |-
      email_domains = [ "*" ]
      set_xauthrequest = true
      upstreams = [
        "http://{{ .Release.Name }}-api:3000/api/",
        "http://{{ .Release.Name }}-web/"
      ]
  # A list (not a map) so --skip-auth-route can repeat.
  extraArgs:
    - --provider=google
    # Forward the authenticated identity to the api as X-Auth-Request-* headers.
    - --set-xauthrequest=true
    # architecture §11: the Stripe webhook and the probes bypass auth. The
    # webhook is still signature-verified in-app (§12).
    - --skip-auth-route=^/healthz$
    - --skip-auth-route=^/readyz$
    # Public landing page (apps/web/public/landing.html, served by web's
    # nginx at the exact "/" path) and robots.txt, so logged-out visitors
    # and crawlers can reach them without a Google session.
    - --skip-auth-route=^/$
    - --skip-auth-route=^/robots.txt$
    # Public Privacy Policy / Terms of Service (apps/web/public/privacy.html,
    # terms.html) and their shared stylesheet — required so the Google OAuth
    # consent screen review, and logged-out visitors generally, can reach
    # them without a Google session.
    - --skip-auth-route=^/privacy$
    - --skip-auth-route=^/terms$
    - --skip-auth-route=^/legal\.css$
    # Shared brand assets (apps/web/public/favicon.ico, public/brand/*) —
    # favicons, touch icons, manifest, and logo. These render on the public
    # landing/legal pages and in browser chrome/OS UI for logged-out
    # visitors, so they must load without a session. Everything under
    # public/brand/ is fair game to skip auth for (no per-file route needed
    # as the set grows — just drop new shared assets in that directory).
    - --skip-auth-route=^/favicon\.ico$
    - --skip-auth-route=^/brand/
  service:
    portNumber: 80
  # Our own templates/ingress.yaml owns the public route.
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
