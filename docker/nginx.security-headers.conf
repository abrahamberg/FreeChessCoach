# Response headers every page and asset gets. Included in the server block AND
# in every location of nginx.web.conf: nginx drops *all* inherited add_header
# directives in a location that declares any of its own (every location here
# sets Cache-Control), so a server-level-only header silently never reaches
# the browser. Keep this file the one place these are defined.

# Cross-origin isolation for multi-threaded WASM (Kokoro TTS coach voice) — see
# vite.config.ts's matching dev-server headers for why 'credentialless' rather
# than 'require-corp'. Redirect-only OAuth (oauth2-proxy), so COOP is safe.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

# Enforced: nothing may frame the app (clickjacking), no plugins, no <base> hijack.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

# Report-only until verified in a browser: the full script/connect policy.
# transformers.js/onnxruntime (browser TTS) and the landing page's inline
# script may need additions (a CDN origin, a script hash) before this can be
# enforced — watch the console for violations, then move it up.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https: http: ws: wss: data: blob:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
