# nginx config for the web image (docker/Dockerfile.web): static bundle only.
# `/api` is not proxied here — oauth2-proxy routes it to the api Service.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cross-origin isolation for multi-threaded WASM (Kokoro TTS coach
    # voice) — see vite.config.ts's matching dev-server headers for why
    # 'credentialless' rather than 'require-corp'. No popup-based OAuth in
    # this app (redirect-only via oauth2-proxy), so COOP doesn't affect it.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public, unauthenticated landing page (oauth2-proxy skip-auth-route
    # matches this exact path — see values.yaml). Takes priority over the
    # catch-all below regardless of declaration order (nginx always prefers
    # an exact "=" match), so it serves landing.html instead of the SPA shell.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    # Public, unauthenticated Privacy Policy / Terms of Service (required for
    # the Google OAuth consent screen). Also skip-auth-routed in values.yaml.
    location = /privacy {
        add_header Cache-Control "no-cache";
        try_files /privacy.html =404;
    }

    location = /terms {
        add_header Cache-Control "no-cache";
        try_files /terms.html =404;
    }

    # Public marketing pages (also skip-auth-routed in values.yaml): the tour,
    # the user guide, and the two pages about bringing your own AI key. Exact
    # matches, so they win over the SPA catch-all below.
    location = /tour {
        add_header Cache-Control "no-cache";
        try_files /tour.html =404;
    }

    location = /guide {
        add_header Cache-Control "no-cache";
        try_files /guide.html =404;
    }

    location = /keys {
        add_header Cache-Control "no-cache";
        try_files /keys.html =404;
    }

    location = /openai-key {
        add_header Cache-Control "no-cache";
        try_files /openai-key.html =404;
    }

    # Screenshots the marketing pages show. Not content-hashed, so a day of
    # caching rather than the immutable year /assets/ gets.
    location /shots/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # History-mode routing: /import, /games, /session/:id, /dashboard and
    # /settings are client-side routes (apps/web/src/App.tsx) with no file on
    # disk, so unknown paths fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
