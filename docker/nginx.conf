# Top-level nginx config for the web image (docker/Dockerfile.web). Replaces the
# base image's own nginx.conf so that the container writes nothing outside /tmp:
# the pid file and every *_temp_path live there, and logs go to stdout/stderr.
# That is what lets the chart run it with readOnlyRootFilesystem and a /tmp
# emptyDir, as any non-root uid.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
